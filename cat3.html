<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Clicker</title>
</head>
<body>
    <div id="cat-container">
        <ul id="cat-list">
            <li data-cat-id="1">cat 1</li>
            <li data-cat-id="2">cat 2</li>
            <li data-cat-id="3">cat 3</li>
            <li data-cat-id="4">cat 4</li>
            <li data-cat-id="5">cat 5</li>
        </ul>
        <h2 style="display: none;" id="cat-name"></h2>
        <img src="" alt="" id="cat-image" width="500" height="500" style="display: none;">
        <p style="display: none;" id="cat-clicks-wrapper">Clicks: <span id="cat-clicks">0</span></p>
    </div>
    <script src="cat3.js"></script>
</body>
</html>
